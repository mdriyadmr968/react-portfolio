<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b14" />
      <stop offset="100%" stop-color="#04060b" />
    </linearGradient>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111728" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0c101c" stop-opacity="0.9" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="28" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="750" fill="url(#bgGrad)" />

  <!-- Grid Blueprint Lines -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="450" x2="1200" y2="450" />
    <line x1="0" y1="600" x2="1200" y2="600" />
    <line x1="200" y1="0" x2="200" y2="750" />
    <line x1="400" y1="0" x2="400" y2="750" />
    <line x1="600" y1="0" x2="600" y2="750" />
    <line x1="800" y1="0" x2="800" y2="750" />
    <line x1="1000" y1="0" x2="1000" y2="750" />
  </g>

  <!-- Ambient Glow -->
  <circle cx="950" cy="180" r="260" fill="#06b6d4" opacity="0.12" filter="url(#softGlow)" />
  <circle cx="200" cy="540" r="220" fill="#8b5cf6" opacity="0.09" filter="url(#softGlow)" />

  <!-- Main Browser Shell -->
  <g transform="translate(60, 45)">
    <rect width="1080" height="660" rx="16" fill="#0a0d18" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />
    
    <!-- Window Header -->
    <path d="M0 16 C0 7.16 7.16 0 16 0 L1064 0 C1072.84 0 1080 7.16 1080 16 L1080 48 L0 48 Z" fill="#121626" />
    <line x1="0" y1="48" x2="1080" y2="48" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1" />

    <!-- Window Dots -->
    <circle cx="28" cy="24" r="5.5" fill="#ef4444" opacity="0.8" />
    <circle cx="46" cy="24" r="5.5" fill="#f59e0b" opacity="0.8" />
    <circle cx="64" cy="24" r="5.5" fill="#10b981" opacity="0.8" />

    <!-- URL Bar -->
    <rect x="240" y="12" width="600" height="24" rx="6" fill="#090c14" stroke="#ffffff" stroke-opacity="0.08" />
    <text x="540" y="28" fill="#78819d" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">learnstratum.vercel.app/learn/distributed-systems</text>

    <!-- Sidebar -->
    <g transform="translate(0, 48)">
      <rect width="190" height="612" fill="#0c101c" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1" />
      
      <!-- Logo -->
      <g transform="translate(24, 26)">
        <rect width="32" height="32" rx="8" fill="url(#aiGrad)" />
        <circle cx="16" cy="16" r="7" fill="none" stroke="#ffffff" stroke-width="2" />
        <circle cx="16" cy="16" r="3" fill="#ffffff" />
        <text x="42" y="22" fill="#ffffff" font-family="'Cinzel', serif" font-weight="bold" font-size="13">LearnStratum</text>
      </g>

      <!-- Sidebar Menu -->
      <g transform="translate(18, 85)" font-family="'JetBrains Mono', monospace" font-size="11">
        <rect x="0" y="0" width="154" height="32" rx="6" fill="#06b6d4" fill-opacity="0.18" stroke="#06b6d4" stroke-opacity="0.4" />
        <text x="14" y="20" fill="#67e8f9" font-weight="600">● Curriculum Graph</text>

        <text x="14" y="58" fill="#717a94">SM-2 Flashcards</text>
        <text x="14" y="96" fill="#717a94">pgvector Search</text>
        <text x="14" y="134" fill="#717a94">Live SSE Tutor</text>
        <text x="14" y="172" fill="#717a94">YouTube Aggregator</text>
        <text x="14" y="210" fill="#717a94">Certificates</text>
      </g>

      <!-- Bottom Status -->
      <g transform="translate(18, 520)">
        <rect width="154" height="60" rx="8" fill="#131828" stroke="#ffffff" stroke-opacity="0.08" />
        <circle cx="16" cy="20" r="4" fill="#10b981" />
        <text x="28" y="18" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600">GEMINI LLM ENGINE</text>
        <text x="16" y="36" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9">PGVECTOR EMBEDDINGS</text>
        <text x="16" y="50" fill="#717a94" font-family="'JetBrains Mono', monospace" font-size="8">SHA-256 CACHING: ON</text>
      </g>
    </g>

    <!-- Main Content Area -->
    <g transform="translate(215, 68)">
      <text x="0" y="22" fill="#ffffff" font-family="'Cinzel', serif" font-size="20" font-weight="bold">Autonomous AI Curriculum Synthesis</text>
      <text x="0" y="42" fill="#737c98" font-family="'JetBrains Mono', monospace" font-size="11">SUPERMEMO-2 SPACED REPETITION // PGVECTOR SEMANTIC RAG</text>

      <!-- Top KPI row -->
      <g transform="translate(0, 60)">
        <g transform="translate(0, 0)">
          <rect width="260" height="92" rx="10" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.08" />
          <text x="16" y="26" fill="#717a94" font-family="'JetBrains Mono', monospace" font-size="10">SYNTHESIZED MODULES</text>
          <text x="16" y="58" fill="#ffffff" font-family="'Cinzel', serif" font-size="24" font-weight="bold">14 Lessons</text>
          <text x="16" y="78" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="9">Dynamic Fallback • Tavily / Jina Vetted</text>
        </g>

        <g transform="translate(275, 0)">
          <rect width="275" height="92" rx="10" fill="url(#cardGrad)" stroke="#06b6d4" stroke-opacity="0.35" />
          <text x="16" y="26" fill="#67e8f9" font-family="'JetBrains Mono', monospace" font-size="10">SUPERMEMO-2 COGNITIVE RETENTION</text>
          <text x="16" y="54" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600">Interval: 6 Days (EF: 2.5)</text>
          <text x="16" y="76" fill="#a5f3fc" font-family="'JetBrains Mono', monospace" font-size="9">3D Flip Deck • Daily Streak: 21 Days</text>
        </g>

        <g transform="translate(565, 0)">
          <rect width="275" height="92" rx="10" fill="url(#cardGrad)" stroke="#818cf8" stroke-opacity="0.35" />
          <text x="16" y="26" fill="#818cf8" font-family="'JetBrains Mono', monospace" font-size="10">SEMANTIC VECTOR RETRIEVAL</text>
          <text x="16" y="54" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="bold">SIMILARITY: 0.942</text>
          <text x="16" y="76" fill="#717a94" font-family="'JetBrains Mono', monospace" font-size="9">text-embedding-004 • pgvector Supabase</text>
        </g>
      </g>

      <!-- Bottom Interactive Visualizer -->
      <g transform="translate(0, 175)">
        <!-- Left: Course Path & Flashcard Preview -->
        <g transform="translate(0, 0)">
          <rect width="470" height="230" rx="12" fill="#0d111e" stroke="#ffffff" stroke-opacity="0.08" />
          <text x="20" y="32" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">Active Spaced Repetition Flashcard</text>
          <text x="360" y="32" fill="#06b6d4" font-family="'JetBrains Mono', monospace" font-size="10">SM-2 ACTIVE</text>
          <line x1="20" y1="46" x2="450" y2="46" stroke="#ffffff" stroke-opacity="0.05" />

          <!-- Flashcard Front/Back Box -->
          <rect x="20" y="60" width="430" height="110" rx="8" fill="#14192d" stroke="#06b6d4" stroke-opacity="0.3" />
          <text x="36" y="85" fill="#67e8f9" font-family="'JetBrains Mono', monospace" font-size="10">CONCEPT PROMPT</text>
          <text x="36" y="106" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold">Explain Raft Consensus Heartbeat Timeout</text>
          <text x="36" y="130" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">Followers transition to Candidate if no Leader heartbeat is received.</text>
          <text x="36" y="152" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="9">RATING: [Easy +6d] [Good +3d] [Hard +1d] [Again &lt;10m]</text>

          <rect x="20" y="185" width="430" height="30" rx="6" fill="url(#aiGrad)" />
          <text x="235" y="204" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" text-anchor="middle">STREAM LIVE AI TUTOR SESSION (SSE)</text>
        </g>

        <!-- Right: Streaming AI Tutor Feed -->
        <g transform="translate(485, 0)">
          <rect width="355" height="230" rx="12" fill="#0d111e" stroke="#ffffff" stroke-opacity="0.08" />
          <text x="20" y="32" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">Streaming Tutor (SSE)</text>
          <line x1="20" y1="46" x2="335" y2="46" stroke="#ffffff" stroke-opacity="0.05" />

          <g transform="translate(20, 60)" font-family="'JetBrains Mono', monospace" font-size="10">
            <rect width="315" height="42" rx="6" fill="#151a2d" />
            <text x="12" y="20" fill="#38bdf8">TUTOR PROMPT:</text>
            <text x="12" y="34" fill="#e2e8f0">Analyzing vector docs for Paxos vs Raft...</text>

            <rect y="50" width="315" height="58" rx="6" fill="#151a2d" stroke="#10b981" stroke-opacity="0.3" />
            <text x="12" y="68" fill="#10b981">GENERATING EXPLANATION (Token 412/500):</text>
            <text x="12" y="84" fill="#ffffff">&quot;Raft optimizes for understandability by decomposing</text>
            <text x="12" y="98" fill="#ffffff">leader election and log replication into discrete states.&quot;</text>

            <rect y="116" width="315" height="34" rx="6" fill="#1a1c30" />
            <text x="12" y="132" fill="#a5b4fc">CRYPTOGRAPHIC CERTIFICATE: ED25519 VERIFIED</text>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
