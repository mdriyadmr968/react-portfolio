<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e17" />
      <stop offset="100%" stop-color="#07080d" />
    </linearGradient>
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#151928" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f121d" stop-opacity="0.9" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="750" fill="url(#bgGrad)" />

  <!-- Grid Blueprint Lines -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="450" x2="1200" y2="450" />
    <line x1="0" y1="600" x2="1200" y2="600" />
    <line x1="200" y1="0" x2="200" y2="750" />
    <line x1="400" y1="0" x2="400" y2="750" />
    <line x1="600" y1="0" x2="600" y2="750" />
    <line x1="800" y1="0" x2="800" y2="750" />
    <line x1="1000" y1="0" x2="1000" y2="750" />
  </g>

  <!-- Ambient Glow Splash -->
  <circle cx="950" cy="200" r="280" fill="#4f46e5" opacity="0.12" filter="url(#softGlow)" />
  <circle cx="250" cy="550" r="220" fill="#06b6d4" opacity="0.08" filter="url(#softGlow)" />

  <!-- Main Browser Shell Container -->
  <g transform="translate(60, 45)">
    <!-- Browser Window Card -->
    <rect width="1080" height="660" rx="16" fill="#0c0f1b" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />
    
    <!-- Window Header -->
    <path d="M0 16 C0 7.16 7.16 0 16 0 L1064 0 C1072.84 0 1080 7.16 1080 16 L1080 48 L0 48 Z" fill="#131726" />
    <line x1="0" y1="48" x2="1080" y2="48" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1" />

    <!-- Window Dots -->
    <circle cx="28" cy="24" r="5.5" fill="#ef4444" opacity="0.8" />
    <circle cx="46" cy="24" r="5.5" fill="#f59e0b" opacity="0.8" />
    <circle cx="64" cy="24" r="5.5" fill="#10b981" opacity="0.8" />

    <!-- URL Bar -->
    <rect x="240" y="12" width="600" height="24" rx="6" fill="#0a0d16" stroke="#ffffff" stroke-opacity="0.08" />
    <text x="540" y="28" fill="#717a94" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">app.oikikbooks.com/dashboard/general-ledger</text>

    <!-- App Sidebar -->
    <g transform="translate(0, 48)">
      <rect width="180" height="612" fill="#0e111e" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1" />
      
      <!-- Brand Logo in Sidebar -->
      <g transform="translate(24, 28)">
        <rect width="28" height="28" rx="6" fill="url(#violetGrad)" />
        <path d="M7 8 L21 8 L21 20 L7 20 Z" fill="none" stroke="#ffffff" stroke-width="1.5" />
        <line x1="14" y1="8" x2="14" y2="20" stroke="#ffffff" stroke-width="1.5" />
        <text x="38" y="19" fill="#ffffff" font-family="'Cinzel', serif" font-weight="bold" font-size="13">OikikBooks</text>
      </g>

      <!-- Sidebar Menu Items -->
      <g transform="translate(18, 85)" font-family="'JetBrains Mono', monospace" font-size="11">
        <!-- Active Item -->
        <rect x="0" y="0" width="144" height="32" rx="6" fill="#4f46e5" fill-opacity="0.18" stroke="#4f46e5" stroke-opacity="0.4" />
        <text x="14" y="20" fill="#a5b4fc" font-weight="600">● Dashboard</text>

        <text x="14" y="58" fill="#69728d">Invoicing</text>
        <text x="14" y="96" fill="#69728d">Bank Rec</text>
        <text x="14" y="134" fill="#69728d">Tax (VAT/GST)</text>
        <text x="14" y="172" fill="#69728d">23+ Reports</text>
        <text x="14" y="210" fill="#69728d">Multi-Org</text>
        <text x="14" y="248" fill="#69728d">Audit Trail</text>
      </g>

      <!-- Bottom Isolated Org Indicator -->
      <g transform="translate(18, 540)">
        <rect width="144" height="42" rx="8" fill="#14192a" stroke="#ffffff" stroke-opacity="0.08" />
        <circle cx="20" cy="21" r="4" fill="#10b981" />
        <text x="32" y="18" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">WORKSPACE</text>
        <text x="32" y="30" fill="#717a94" font-family="'JetBrains Mono', monospace" font-size="9">ISOLATED SCHEMA</text>
      </g>
    </g>

    <!-- Dashboard Content Area -->
    <g transform="translate(205, 68)">
      <!-- Top Title Bar -->
      <text x="0" y="24" fill="#ffffff" font-family="'Cinzel', serif" font-size="20" font-weight="bold">Financial Analytics &amp; Double-Entry Ledger</text>
      <text x="0" y="44" fill="#6e7792" font-family="'JetBrains Mono', monospace" font-size="11">AUTOMATED FISCAL RECONCILIATION // 2026</text>

      <!-- KPI Stat Cards Row -->
      <g transform="translate(0, 65)">
        <!-- Stat 1: Total Cash -->
        <g transform="translate(0, 0)">
          <rect width="195" height="90" rx="10" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.08" />
          <text x="16" y="26" fill="#717a94" font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing="1">CASH POSITION</text>
          <text x="16" y="58" fill="#ffffff" font-family="'Cinzel', serif" font-size="22" font-weight="bold">$48,250</text>
          <rect x="16" y="72" width="163" height="4" rx="2" fill="#1e2438" />
          <rect x="16" y="72" width="134" height="4" rx="2" fill="url(#emeraldGrad)" />
        </g>

        <!-- Stat 2: Receivables -->
        <g transform="translate(210, 0)">
          <rect width="195" height="90" rx="10" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.08" />
          <text x="16" y="26" fill="#717a94" font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing="1">RECEIVABLES</text>
          <text x="16" y="58" fill="#ffffff" font-family="'Cinzel', serif" font-size="22" font-weight="bold">$12,840</text>
          <rect x="16" y="72" width="163" height="4" rx="2" fill="#1e2438" />
          <rect x="16" y="72" width="120" height="4" rx="2" fill="url(#cyanGrad)" />
        </g>

        <!-- Stat 3: Payables -->
        <g transform="translate(420, 0)">
          <rect width="195" height="90" rx="10" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.08" />
          <text x="16" y="26" fill="#717a94" font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing="1">PAYABLES</text>
          <text x="16" y="58" fill="#ffffff" font-family="'Cinzel', serif" font-size="22" font-weight="bold">$8,120</text>
          <rect x="16" y="72" width="163" height="4" rx="2" fill="#1e2438" />
          <rect x="16" y="72" width="98" height="4" rx="2" fill="#f59e0b" />
        </g>

        <!-- Stat 4: Net Profit -->
        <g transform="translate(630, 0)">
          <rect width="215" height="90" rx="10" fill="url(#cardGrad)" stroke="#4f46e5" stroke-opacity="0.3" />
          <text x="16" y="26" fill="#a5b4fc" font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing="1">NET PROFIT (EBITDA)</text>
          <text x="16" y="58" fill="#ffffff" font-family="'Cinzel', serif" font-size="22" font-weight="bold">$15,670</text>
          <rect x="16" y="72" width="183" height="4" rx="2" fill="#1e2438" />
          <rect x="16" y="72" width="146" height="4" rx="2" fill="url(#violetGrad)" />
        </g>
      </g>

      <!-- Main Graph Card & Recent Transactions Grid -->
      <g transform="translate(0, 180)">
        <!-- Chart Section -->
        <rect width="525" height="235" rx="12" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.08" />
        <text x="20" y="32" fill="#ffffff" font-family="'Cinzel', serif" font-size="14" font-weight="bold">Revenue Flow vs Operating Expenses</text>
        <text x="440" y="32" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="11">+24.8% YoY</text>

        <!-- Chart Grid Lines -->
        <g stroke="#ffffff" stroke-opacity="0.05" stroke-dasharray="3 3">
          <line x1="25" y1="70" x2="500" y2="70" />
          <line x1="25" y1="120" x2="500" y2="120" />
          <line x1="25" y1="170" x2="500" y2="170" />
        </g>

        <!-- Revenue Area & Polyline -->
        <path d="M 30 180 Q 80 150 130 140 T 230 110 T 330 90 T 430 65 T 495 50 L 495 200 L 30 200 Z" fill="url(#violetGrad)" fill-opacity="0.15" />
        <path d="M 30 180 Q 80 150 130 140 T 230 110 T 330 90 T 430 65 T 495 50" fill="none" stroke="#818cf8" stroke-width="3" />

        <!-- Chart Nodes -->
        <circle cx="130" cy="140" r="4" fill="#ffffff" stroke="#4f46e5" stroke-width="2" />
        <circle cx="230" cy="110" r="4" fill="#ffffff" stroke="#4f46e5" stroke-width="2" />
        <circle cx="330" cy="90" r="4" fill="#ffffff" stroke="#4f46e5" stroke-width="2" />
        <circle cx="430" cy="65" r="4" fill="#ffffff" stroke="#4f46e5" stroke-width="2" />
        <circle cx="495" cy="50" r="5" fill="#a5b4fc" stroke="#ffffff" stroke-width="2" />

        <!-- X Axis Months -->
        <g fill="#5e667d" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">
          <text x="40" y="215">JAN</text>
          <text x="130" y="215">MAR</text>
          <text x="230" y="215">MAY</text>
          <text x="330" y="215">JUL</text>
          <text x="430" y="215">SEP</text>
          <text x="495" y="215">DEC</text>
        </g>

        <!-- Right Side: Recent Transactions & Subledgers -->
        <g transform="translate(545, 0)">
          <rect width="300" height="235" rx="12" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.08" />
          <text x="18" y="32" fill="#ffffff" font-family="'Cinzel', serif" font-size="14" font-weight="bold">Audited Journal Postings</text>

          <g transform="translate(18, 55)" font-family="'JetBrains Mono', monospace">
            <!-- Row 1 -->
            <rect width="264" height="42" rx="6" fill="#121626" />
            <circle cx="18" cy="21" r="5" fill="#10b981" />
            <text x="32" y="18" fill="#e2e8f0" font-size="11">INV-2026-0891</text>
            <text x="32" y="32" fill="#64748b" font-size="9">Client Settlement • Multi-Curr</text>
            <text x="250" y="26" fill="#10b981" font-size="11" text-anchor="end">+$6,400</text>

            <!-- Row 2 -->
            <rect y="50" width="264" height="42" rx="6" fill="#121626" />
            <circle cx="18" cy="71" r="5" fill="#3b82f6" />
            <text x="32" y="68" fill="#e2e8f0" font-size="11">BANK-REC-1044</text>
            <text x="32" y="82" fill="#64748b" font-size="9">Automated Rule Reconciliation</text>
            <text x="250" y="76" fill="#38bdf8" font-size="11" text-anchor="end">MATCH</text>

            <!-- Row 3 -->
            <rect y="100" width="264" height="42" rx="6" fill="#121626" />
            <circle cx="18" cy="121" r="5" fill="#f59e0b" />
            <text x="32" y="118" fill="#e2e8f0" font-size="11">TAX-VAT-Q1-POST</text>
            <text x="32" y="132" fill="#64748b" font-size="9">Statutory Ledger Revaluation</text>
            <text x="250" y="126" fill="#f59e0b" font-size="11" text-anchor="end">POSTED</text>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
