<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913" />
      <stop offset="100%" stop-color="#04050a" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#994ff5" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="solanaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14f195" />
      <stop offset="100%" stop-color="#9945ff" />
    </linearGradient>
    <linearGradient id="geminiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#121626" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0d101d" stop-opacity="0.9" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="28" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="750" fill="url(#bgGrad)" />

  <!-- Blueprint Mesh Grid -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="450" x2="1200" y2="450" />
    <line x1="0" y1="600" x2="1200" y2="600" />
    <line x1="200" y1="0" x2="200" y2="750" />
    <line x1="400" y1="0" x2="400" y2="750" />
    <line x1="600" y1="0" x2="600" y2="750" />
    <line x1="800" y1="0" x2="800" y2="750" />
    <line x1="1000" y1="0" x2="1000" y2="750" />
  </g>

  <!-- Ambient Glow Orbs -->
  <circle cx="980" cy="180" r="260" fill="#994ff5" opacity="0.14" filter="url(#softGlow)" />
  <circle cx="220" cy="540" r="200" fill="#38bdf8" opacity="0.09" filter="url(#softGlow)" />

  <!-- Main Browser Shell -->
  <g transform="translate(60, 45)">
    <rect width="1080" height="660" rx="16" fill="#0a0c16" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />
    
    <!-- Window Header -->
    <path d="M0 16 C0 7.16 7.16 0 16 0 L1064 0 C1072.84 0 1080 7.16 1080 16 L1080 48 L0 48 Z" fill="#111422" />
    <line x1="0" y1="48" x2="1080" y2="48" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1" />

    <!-- Window Dots -->
    <circle cx="28" cy="24" r="5.5" fill="#ef4444" opacity="0.8" />
    <circle cx="46" cy="24" r="5.5" fill="#f59e0b" opacity="0.8" />
    <circle cx="64" cy="24" r="5.5" fill="#10b981" opacity="0.8" />

    <!-- URL Bar -->
    <rect x="240" y="12" width="600" height="24" rx="6" fill="#080a12" stroke="#ffffff" stroke-opacity="0.08" />
    <text x="540" y="28" fill="#78819d" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">thinpay-wallet.vercel.app/dashboard/multi-chain</text>

    <!-- Sidebar -->
    <g transform="translate(0, 48)">
      <rect width="190" height="612" fill="#0c0e1a" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1" />
      
      <!-- Brand Logo -->
      <g transform="translate(24, 26)">
        <rect width="32" height="32" rx="8" fill="url(#primaryGrad)" />
        <path d="M10 16 L16 10 L22 16 L16 22 Z" fill="#ffffff" />
        <text x="42" y="22" fill="#ffffff" font-family="'Cinzel', serif" font-weight="bold" font-size="14">ThinPay</text>
      </g>

      <!-- Sidebar Menu Items -->
      <g transform="translate(18, 85)" font-family="'JetBrains Mono', monospace" font-size="11">
        <rect x="0" y="0" width="154" height="32" rx="6" fill="#994ff5" fill-opacity="0.18" stroke="#994ff5" stroke-opacity="0.4" />
        <text x="14" y="20" fill="#d8b4fe" font-weight="600">● Portfolio</text>

        <text x="14" y="58" fill="#717a94">0x Swap Engine</text>
        <text x="14" y="96" fill="#717a94">ERC-4337 Batch</text>
        <text x="14" y="134" fill="#717a94">Gemini AI Audit</text>
        <text x="14" y="172" fill="#717a94">Revoke Approvals</text>
        <text x="14" y="210" fill="#717a94">Passkey Auth</text>
      </g>

      <!-- Security Status Badge -->
      <g transform="translate(18, 520)">
        <rect width="154" height="60" rx="8" fill="#131728" stroke="#ffffff" stroke-opacity="0.08" />
        <circle cx="16" cy="20" r="4" fill="#10b981" />
        <text x="28" y="18" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600">AES-256-GCM / PBKDF2</text>
        <text x="16" y="36" fill="#994ff5" font-family="'JetBrains Mono', monospace" font-size="9">ERC-4337 PAYMASTER</text>
        <text x="16" y="50" fill="#717a94" font-family="'JetBrains Mono', monospace" font-size="8">GASLESS SPONSOR: ACTIVE</text>
      </g>
    </g>

    <!-- Content Area -->
    <g transform="translate(215, 68)">
      <!-- Top Title -->
      <text x="0" y="22" fill="#ffffff" font-family="'Cinzel', serif" font-size="20" font-weight="bold">Multi-Chain Self-Custody &amp; AI Copilot</text>
      <text x="0" y="42" fill="#737c98" font-family="'JetBrains Mono', monospace" font-size="11">4 EVM NETWORKS + SOLANA DEVNET // VIEM CLIENT</text>

      <!-- Stat Cards -->
      <g transform="translate(0, 60)">
        <!-- Total Value -->
        <g transform="translate(0, 0)">
          <rect width="260" height="92" rx="10" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.08" />
          <text x="16" y="26" fill="#717a94" font-family="'JetBrains Mono', monospace" font-size="10">AGGREGATED BALANCE</text>
          <text x="16" y="58" fill="#ffffff" font-family="'Cinzel', serif" font-size="24" font-weight="bold">$84,192.40</text>
          <text x="16" y="78" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="9">+4.8% (24h) • 5 Chains Connected</text>
        </g>

        <!-- Passkey Account Abstraction -->
        <g transform="translate(275, 0)">
          <rect width="275" height="92" rx="10" fill="url(#cardGrad)" stroke="#994ff5" stroke-opacity="0.35" />
          <text x="16" y="26" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="10">ERC-4337 ACCOUNT ABSTRACTION</text>
          <text x="16" y="54" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600">WebAuthn Biometric</text>
          <text x="16" y="76" fill="#93c5fd" font-family="'JetBrains Mono', monospace" font-size="9">Sponsored Gasless Batch Transfers</text>
        </g>

        <!-- Gemini AI Audit -->
        <g transform="translate(565, 0)">
          <rect width="275" height="92" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity="0.35" />
          <text x="16" y="26" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10">GEMINI AI RISK COPILOT</text>
          <text x="16" y="54" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="bold">AUDIT: VERIFIED SAFE</text>
          <text x="16" y="76" fill="#717a94" font-family="'JetBrains Mono', monospace" font-size="9">Pre-Flight Simulation • 0 Exploits</text>
        </g>
      </g>

      <!-- Split Windows: Swap Routing + AI Copilot Terminal -->
      <g transform="translate(0, 175)">
        <!-- Left: 0x Swap & Chain Balances -->
        <g transform="translate(0, 0)">
          <rect width="470" height="230" rx="12" fill="#0d101e" stroke="#ffffff" stroke-opacity="0.08" />
          <text x="20" y="32" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">0x Protocol Swap Routing</text>
          <text x="360" y="32" fill="#994ff5" font-family="'JetBrains Mono', monospace" font-size="10">BEST RATE</text>
          <line x1="20" y1="46" x2="450" y2="46" stroke="#ffffff" stroke-opacity="0.05" />

          <!-- Pay Token -->
          <rect x="20" y="60" width="430" height="60" rx="8" fill="#14182a" stroke="#ffffff" stroke-opacity="0.06" />
          <text x="36" y="85" fill="#717a94" font-family="'JetBrains Mono', monospace" font-size="9">YOU PAY (ETHEREUM SEPOLIA)</text>
          <text x="36" y="106" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="bold">1.50 ETH</text>
          <text x="360" y="98" fill="#994ff5" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold">$4,860.00</text>

          <!-- Receive Token -->
          <rect x="20" y="130" width="430" height="60" rx="8" fill="#14182a" stroke="#ffffff" stroke-opacity="0.06" />
          <text x="36" y="155" fill="#717a94" font-family="'JetBrains Mono', monospace" font-size="9">YOU RECEIVE (SOLANA DEVNET)</text>
          <text x="36" y="176" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="bold">28.45 SOL</text>
          <text x="360" y="168" fill="#14f195" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold">SLIPPAGE 0.1%</text>

          <!-- Swap CTA -->
          <rect x="20" y="200" width="430" height="22" rx="6" fill="url(#primaryGrad)" />
          <text x="235" y="215" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" text-anchor="middle">SIGN VIA VIEM &amp; WEBAUTHN PASSKEY</text>
        </g>

        <!-- Right: Gemini AI Transaction Guard -->
        <g transform="translate(485, 0)">
          <rect width="355" height="230" rx="12" fill="#0d101e" stroke="#ffffff" stroke-opacity="0.08" />
          <text x="20" y="32" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">Gemini AI Pre-Flight Audit</text>
          <line x1="20" y1="46" x2="335" y2="46" stroke="#ffffff" stroke-opacity="0.05" />

          <g transform="translate(20, 60)" font-family="'JetBrains Mono', monospace" font-size="10">
            <rect width="315" height="32" rx="6" fill="#151a2d" />
            <circle cx="16" cy="16" r="4" fill="#10b981" />
            <text x="28" y="20" fill="#e2e8f0">Contract Bytecode Simulation: PASS</text>

            <rect y="40" width="315" height="32" rx="6" fill="#151a2d" />
            <circle cx="16" cy="56" r="4" fill="#10b981" />
            <text x="28" y="60" fill="#e2e8f0">0x Allowance Drainer Check: SAFE</text>

            <rect y="80" width="315" height="32" rx="6" fill="#151a2d" />
            <circle cx="16" cy="96" r="4" fill="#10b981" />
            <text x="28" y="100" fill="#e2e8f0">Reentrancy &amp; Flash-Loan Shield: CLEAR</text>

            <rect y="120" width="315" height="38" rx="6" fill="#1a1835" stroke="#994ff5" stroke-opacity="0.3" />
            <text x="12" y="136" fill="#d8b4fe" font-size="9">AI RECOMMENDATION:</text>
            <text x="12" y="150" fill="#ffffff" font-size="9">&quot;Transaction verified safe to execute.&quot;</text>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
