<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="pBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d14" />
      <stop offset="100%" stop-color="#06080d" />
    </linearGradient>
    <linearGradient id="pBrandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="pCoralGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3a4d" />
      <stop offset="100%" stop-color="#ff8538" />
    </linearGradient>
    <linearGradient id="pVioletGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="pCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#131926" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0d121c" stop-opacity="0.9" />
    </linearGradient>
    <filter id="pSoftGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="750" fill="url(#pBgGrad)" />

  <!-- Grid Blueprint Lines -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="450" x2="1200" y2="450" />
    <line x1="0" y1="600" x2="1200" y2="600" />
    <line x1="200" y1="0" x2="200" y2="750" />
    <line x1="400" y1="0" x2="400" y2="750" />
    <line x1="600" y1="0" x2="600" y2="750" />
    <line x1="800" y1="0" x2="800" y2="750" />
    <line x1="1000" y1="0" x2="1000" y2="750" />
  </g>

  <!-- Ambient Glow Splash -->
  <circle cx="250" cy="220" r="260" fill="#14b8a6" opacity="0.12" filter="url(#pSoftGlow)" />
  <circle cx="950" cy="500" r="280" fill="#ff3a4d" opacity="0.10" filter="url(#pSoftGlow)" />

  <!-- Main Browser Shell Container -->
  <g transform="translate(60, 45)">
    <!-- Browser Window Card -->
    <rect width="1080" height="660" rx="16" fill="#0b0f1a" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />

    <!-- Window Header -->
    <path d="M0 16 C0 7.16 7.16 0 16 0 L1064 0 C1072.84 0 1080 7.16 1080 16 L1080 48 L0 48 Z" fill="#121724" />
    <line x1="0" y1="48" x2="1080" y2="48" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1" />

    <!-- Window Dots -->
    <circle cx="28" cy="24" r="5.5" fill="#ef4444" opacity="0.8" />
    <circle cx="46" cy="24" r="5.5" fill="#f59e0b" opacity="0.8" />
    <circle cx="64" cy="24" r="5.5" fill="#10b981" opacity="0.8" />

    <!-- URL Bar -->
    <rect x="240" y="12" width="600" height="24" rx="6" fill="#090d16" stroke="#ffffff" stroke-opacity="0.08" />
    <text x="540" y="28" fill="#717a94" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">prayogik.com/learn/course-roadmap</text>

    <!-- Top App Navigation Bar -->
    <g transform="translate(0, 48)">
      <rect width="1080" height="52" fill="#0e1320" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1" />
      
      <!-- Brand Logo in Navbar -->
      <g transform="translate(28, 14)">
        <rect width="24" height="24" rx="6" fill="url(#pBrandGrad)" />
        <path d="M7 12 L11 16 L17 8" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        <text x="34" y="17" fill="#ffffff" font-family="'Cinzel', serif" font-weight="bold" font-size="14">PRAYOGIK</text>
      </g>

      <!-- Nav Links -->
      <g transform="translate(240, 31)" font-family="'JetBrains Mono', monospace" font-size="11" fill="#7d86a0">
        <text x="0" y="0" fill="#2dd4bf" font-weight="bold">● Courses</text>
        <text x="80" y="0">Live Cohorts</text>
        <text x="190" y="0">Career Tracks</text>
        <text x="310" y="0">Roadmap</text>
      </g>

      <!-- Prime Membership Badge -->
      <g transform="translate(900, 12)">
        <rect width="150" height="28" rx="6" fill="url(#pCoralGrad)" />
        <text x="75" y="18" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" text-anchor="middle">PRIME MEMBERSHIP ★</text>
      </g>
    </g>

    <!-- Main Platform LMS Workspace -->
    <g transform="translate(28, 125)">
      <!-- Left Column: Featured Course & Interactive Video Player Simulator -->
      <g transform="translate(0, 0)">
        <rect width="650" height="490" rx="14" fill="url(#pCardGrad)" stroke="#ffffff" stroke-opacity="0.08" />

        <!-- Video Player Frame Header -->
        <g transform="translate(20, 20)">
          <!-- Top Badge -->
          <rect width="180" height="22" rx="4" fill="#14b8a6" fill-opacity="0.2" stroke="#14b8a6" stroke-opacity="0.5" />
          <text x="90" y="15" fill="#2dd4bf" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" text-anchor="middle">LIVE COHORT IN PROGRESS</text>
          
          <!-- Course Title -->
          <text x="0" y="52" fill="#ffffff" font-family="'Cinzel', serif" font-size="20" font-weight="bold">Comprehensive Meta &amp; Digital Growth Engine</text>
          <text x="0" y="74" fill="#8089a3" font-family="'JetBrains Mono', monospace" font-size="11">MODULE 04: FULL-FUNNEL RETARGETING &amp; HIGH-ROAS CONVERSIONS</text>
        </g>

        <!-- Video Screen Container -->
        <g transform="translate(20, 110)">
          <rect width="610" height="270" rx="10" fill="#090d16" stroke="#ffffff" stroke-opacity="0.06" />
          
          <!-- Simulated Graphic & Waveform inside player -->
          <path d="M 0 200 Q 150 120 300 160 T 610 100 L 610 270 L 0 270 Z" fill="url(#pBrandGrad)" fill-opacity="0.12" />
          <path d="M 0 200 Q 150 120 300 160 T 610 100" fill="none" stroke="#14b8a6" stroke-width="2.5" stroke-dasharray="6 3" />
          
          <!-- Center Play Button with Pulsing Ring -->
          <circle cx="305" cy="135" r="32" fill="#ffffff" fill-opacity="0.08" stroke="#14b8a6" stroke-width="1.5" />
          <circle cx="305" cy="135" r="22" fill="#14b8a6" />
          <polygon points="300,126 314,135 300,144" fill="#ffffff" />

          <!-- Video Progress Bar at bottom -->
          <rect x="20" y="248" width="570" height="4" rx="2" fill="#1e2538" />
          <rect x="20" y="248" width="370" height="4" rx="2" fill="url(#pCoralGrad)" />
          <circle cx="390" cy="250" r="5" fill="#ffffff" />
          <text x="20" y="240" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="10">01:14:28 / 01:50:00</text>
          <text x="590" y="240" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="end">1080p HD • 60FPS</text>
        </g>

        <!-- Bottom Course Meta Strip -->
        <g transform="translate(20, 400)" font-family="'JetBrains Mono', monospace">
          <rect width="610" height="65" rx="8" fill="#101524" />
          <circle cx="35" cy="32" r="16" fill="#1e293b" />
          <text x="35" y="36" fill="#ffffff" font-size="11" text-anchor="middle">IBY</text>
          <text x="64" y="26" fill="#ffffff" font-size="12" font-weight="600">Lead Instructor: Ishaque Bin Yousuf</text>
          <text x="64" y="42" fill="#717a94" font-size="10">414+ Enrolled Students • 4.9★ Community Rating</text>

          <rect x="490" y="18" width="105" height="30" rx="6" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.2" />
          <text x="542" y="37" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">NEXT LESSON →</text>
        </g>
      </g>

      <!-- Right Column: Interactive Curriculum Roadmap & Cohorts -->
      <g transform="translate(675, 0)">
        <rect width="350" height="490" rx="14" fill="url(#pCardGrad)" stroke="#ffffff" stroke-opacity="0.08" />

        <g transform="translate(20, 20)">
          <text x="0" y="20" fill="#ffffff" font-family="'Cinzel', serif" font-size="16" font-weight="bold">Course Track Roadmap</text>
          <text x="0" y="38" fill="#717a94" font-family="'JetBrains Mono', monospace" font-size="10">STRUCTURED LEARNING MILESTONES</text>

          <!-- Roadmap Nodes Timeline -->
          <g transform="translate(0, 60)" font-family="'JetBrains Mono', monospace">
            <!-- Connecting Line -->
            <line x1="16" y1="20" x2="16" y2="310" stroke="#334155" stroke-width="2" stroke-dasharray="4 4" />

            <!-- Milestone 1: Done -->
            <g transform="translate(0, 0)">
              <circle cx="16" cy="16" r="12" fill="#10b981" />
              <path d="M12 16 L15 19 L20 13" fill="none" stroke="#ffffff" stroke-width="2" />
              <text x="38" y="14" fill="#ffffff" font-size="11" font-weight="600">01. Funnel Architecture</text>
              <text x="38" y="28" fill="#64748b" font-size="9">Completed • 4 Lessons</text>
            </g>

            <!-- Milestone 2: Done -->
            <g transform="translate(0, 65)">
              <circle cx="16" cy="16" r="12" fill="#10b981" />
              <path d="M12 16 L15 19 L20 13" fill="none" stroke="#ffffff" stroke-width="2" />
              <text x="38" y="14" fill="#ffffff" font-size="11" font-weight="600">02. Creative Strategy &amp; Copy</text>
              <text x="38" y="28" fill="#64748b" font-size="9">Completed • 6 Lessons</text>
            </g>

            <!-- Milestone 3: Active Now -->
            <g transform="translate(0, 130)">
              <circle cx="16" cy="16" r="14" fill="#14b8a6" fill-opacity="0.2" stroke="#14b8a6" stroke-width="2" />
              <circle cx="16" cy="16" r="6" fill="#14b8a6" />
              <rect x="36" y="2" width="265" height="48" rx="8" fill="#13232c" stroke="#14b8a6" stroke-opacity="0.4" />
              <text x="46" y="20" fill="#2dd4bf" font-size="11" font-weight="bold">03. Meta Ads Launch Project</text>
              <text x="46" y="36" fill="#94a3b8" font-size="9">Live Session • In Progress (72%)</text>
            </g>

            <!-- Milestone 4: Upcoming -->
            <g transform="translate(0, 205)">
              <circle cx="16" cy="16" r="10" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
              <text x="38" y="14" fill="#94a3b8" font-size="11">04. ROAS Scaling &amp; Tracking</text>
              <text x="38" y="28" fill="#475569" font-size="9">Locked • Unlocks on Module 03 completion</text>
            </g>

            <!-- Milestone 5: Upcoming -->
            <g transform="translate(0, 260)">
              <circle cx="16" cy="16" r="10" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
              <text x="38" y="14" fill="#94a3b8" font-size="11">05. Capstone Case Study</text>
              <text x="38" y="28" fill="#475569" font-size="9">Final Industry Certification</text>
            </g>
          </g>

          <!-- Bottom Community Badge -->
          <g transform="translate(0, 390)">
            <rect width="310" height="42" rx="8" fill="#101524" stroke="#ffffff" stroke-opacity="0.06" />
            <circle cx="20" cy="21" r="5" fill="#10b981" />
            <text x="34" y="20" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">LIVE CHAT &amp; COMMUNITY</text>
            <text x="34" y="32" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">2,400+ ACTIVE LEARNERS</text>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
